name: Deploy

# Dijalankan setelah CI HIJAU, bukan langsung saat push, agar commit yang gagal test tak terpasang ke mesin kasir.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Dua deploy bersamaan berebut symlink `aktif`; diantre, jangan dibatalkan karena membatalkan di tengah bisa meninggalkan rilis setengah terpasang.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build lalu kirim ke VPS
    # Hanya jalan bila CI sukses; `workflow_dispatch` tak punya `workflow_run`, jadi kondisinya dilonggarkan untuk deploy manual.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Runner dipatok (bukan `ubuntu-latest`) karena binary Rust ditautkan ke glibc pembangun; runner yang naik versi bisa menghasilkan binary yang menolak jalan di Debian 13.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run memakai berkas workflow dari branch default, padahal yang harus dibangun adalah commit yang memicu CI.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build backend
        working-directory: backend
        # Memakai cache query di backend/.sqlx, jadi tidak perlu database.
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Rakit paket
        run: |
          mkdir -p paket/web
          cp backend/target/release/aj33-backend paket/
          cp -r web/dist paket/web/dist
          cp web/package.json web/package-lock.json paket/web/
          du -sh paket

      - name: Siapkan kunci SSH
        env:
          KUNCI: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KUNCI" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Host key dipasang dari secret, bukan `ssh-keyscan` saat jalan, karena keyscan mempercayai apa pun yang menjawab dan membatalkan gunanya memverifikasi host.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Kirim ke VPS
        env:
          TUJUAN: ${{ secrets.VPS_HOST }}
        run: |
          tar czf - -C paket . \
            | ssh -i ~/.ssh/id_deploy \
                  -o BatchMode=yes \
                  -o ConnectTimeout=20 \
                  "$TUJUAN"

      - name: Pastikan situs melayani
        # Penerima di VPS memeriksa dari dalam dan mengembalikan rilis lama bila gagal; ini memeriksa dari luar agar Caddy dan TLS ikut terbukti baik.
        run: |
          KODE=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
                 https://tokoayamaj33.my.id/login)
          echo "https://tokoayamaj33.my.id/login -> $KODE"
          [ "$KODE" = "200" ]
