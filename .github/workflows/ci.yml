name: CI

on:
  push:
    branches: [main]
  pull_request:

# Dorongan baru ke branch yang sama membatalkan run lama yang masih jalan --
# hasilnya sudah tidak relevan begitu ada commit yang lebih baru.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aj33
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aj33"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aj33

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        working-directory: backend
        # Dijalankan sebelum yang lain: paling cepat, dan kegagalannya
        # paling mudah diperbaiki.
        run: cargo fmt --check

      - name: Siapkan database
        run: |
          cargo install sqlx-cli --version 0.8 --no-default-features --features rustls,postgres --locked
          sqlx migrate run --source db/migrations

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: backend
        run: cargo test

      - name: Cache query sqlx masih sesuai skema
        working-directory: backend
        # `.sqlx/` yang basi membuat build produksi (SQLX_OFFLINE=true)
        # memakai bentuk query lama. Diperiksa di sini supaya ketahuan di PR,
        # bukan saat deploy.
        run: cargo sqlx prepare --check -- --all-targets

  frontend:
    name: Frontend (Astro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        run: npm run build
